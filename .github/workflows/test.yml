# GitHub Actions CI/CD Pipeline for Test Execution
# Generated by BMad TEA Agent - Test Architect Module
# Optimized for: Code Quality, Test Coverage (Matrix), Burn-In Loop
# Stack: backend | Framework: pytest

name: Test Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, beta, stable]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Weekly burn-in on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint stage - Code quality checks
  lint:
    name: Lint (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run linter
        run: |
          set -euo pipefail
          # Restrict lint scope to the maintained Python daemon and its tests.
          flake8 resources/daemon tests

  # Test stage - execution with coverage
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          # Security: inputs passed through env: to prevent script injection
          python -m pytest --cov=resources/daemon --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

  # Load stage - heavy scenarios excluded from the default `-m 'not load'` addopts
  # (story 19.6 AC7), run explicitly here so they are exercised in CI.
  load:
    name: Load tests (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run load tests
        run: |
          set -euo pipefail
          python -m pytest -m load -q

  # Node stage - frontend unit tests (node --test, no build step)
  node:
    name: Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run node unit tests
        run: |
          set -euo pipefail
          node --test tests/unit/*.node.test.js

  # PHP stage - syntax lint on every tracked PHP file (matrix: PHP 7.4, the
  # version running on the production box, and 8.2), then execute the test
  # files that are self-contained (they stub the Jeedom AJAX layer via
  # JEEDOM2HA_AJAX_FUNCTIONS_ONLY and don't need a real Jeedom install).
  # A fixed, explicit list of test files requires a real Jeedom core
  # bootstrap (core/php/core.inc.php) that only exists inside an actual
  # Jeedom installation; those are skipped with an explicit message instead
  # of failing, matching this project's existing convention of validating
  # them manually on a real box (see docs/dev-deploy.md). Any other test
  # failure fails the job.
  php:
    name: PHP lint & tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.2']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Lint PHP sources
        run: |
          set -euo pipefail
          git ls-files '*.php' | xargs -n1 php -l

      - name: Run PHP test files
        run: |
          set -euo pipefail
          # Test files that require a real Jeedom core bootstrap
          # (core/php/core.inc.php); not available in CI, skipped explicitly.
          NEEDS_JEEDOM_CORE=(
            "tests/test_php_published_scope_relay.php"
            "tests/test_php_topology_extraction.php"
            "tests/test_runtime_bootstrap_startup.php"
          )
          passed=0
          skipped=0
          failed=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            skip=0
            for needs_core in "${NEEDS_JEEDOM_CORE[@]}"; do
              if [ "$f" = "$needs_core" ]; then
                skip=1
                break
              fi
            done
            if [ "$skip" -eq 1 ]; then
              echo "--- $f ---"
              echo "SKIP: $f requires a real Jeedom install (core.inc.php not available in CI)."
              skipped=$((skipped + 1))
              continue
            fi
            echo "--- $f ---"
            if out=$(php "$f" 2>&1); then
              echo "$out"
              passed=$((passed + 1))
            else
              echo "$out"
              echo "FAIL: $f"
              failed=$((failed + 1))
            fi
          done < <(find tests -type f -name '*.php' | sort)
          echo "php tests: $passed passed, $skipped skipped, $failed failed"
          [ "$failed" -eq 0 ]

  # Shell stage - syntax check every script (never executes them)
  shell-syntax:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: bash -n on scripts/*.sh
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

  # Burn-in stage - Flaky test detection
  burn-in:
    name: Burn-In (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    # Execute only on schedule or if PR has 'burn-in' label
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'burn-in'))

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run burn-in loop (10 iterations)
        run: |
          set -euo pipefail
          echo "🔥 Starting burn-in loop - detecting flaky tests"
          for i in {1..10}; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Burn-in iteration $i/10"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            # Burn-in must use the same command scope as main tests for consistency
            python -m pytest --cov=resources/daemon --cov-report=term-missing || exit 1
          done
          echo "✅ Burn-in complete - no flaky tests detected"

  # Report stage - Aggregate and publish results
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [lint, test, burn-in, load, node, php, shell-syntax]
    if: always()

    steps:
      - name: Generate summary
        run: |
          set -euo pipefail
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status (Lint)**: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status (Tests)**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Burn-in**: ${{ needs.burn-in.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status (Load)**: ${{ needs.load.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status (Node)**: ${{ needs.node.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status (PHP)**: ${{ needs.php.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status (Shell syntax)**: ${{ needs.shell-syntax.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.burn-in.result }}" == "failure" ]; then
            echo "⚠️ **Flaky tests detected** - Review burn-in logs" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce global test gate
        run: |
          set -euo pipefail

          failures=0
          for result in \
            "lint:${{ needs.lint.result }}" \
            "test:${{ needs.test.result }}" \
            "load:${{ needs.load.result }}" \
            "node:${{ needs.node.result }}" \
            "php:${{ needs.php.result }}" \
            "shell-syntax:${{ needs.shell-syntax.result }}"; do
            job="${result%%:*}"
            status="${result#*:}"
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "Required CI job $job finished with status: $status" >&2
              failures=1
            fi
          done

          burn_in_status="${{ needs.burn-in.result }}"
          if [ "$burn_in_status" != "success" ] && [ "$burn_in_status" != "skipped" ]; then
            echo "Burn-in finished with invalid status: $burn_in_status" >&2
            failures=1
          fi

          exit "$failures"
